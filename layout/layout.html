<meta name="viewport" content="width=device-width, user-scalable=no" />

<script>
    let pageTitle = "Default Title";
</script>

<head>
    <title id="pageTitle">{pageTitle}</title>
</head>

<bod id="body">
    <audio id="backgroundMusic" src="/music/silence.mp3" autoplay loop></audio>
    <div class="center">
        <div class="welcome">
            <div class="headerTime">12:34 PM</div>
            <h1 id="headerTitle">{headerTitle}</h1>
            <div class="headerButtons">
                <button onclick="handleMute()">
                    <img id="muteIcon" src="/icons/volume.svg" />
                </button>
                <button onclick="handleThemeOpen()">
                    <img src="/icons/fill.svg" />
                </button>
                <button onclick="handleFullscreen()">
                    <img id="fullscreenIcon" src="/icons/expand.svg" />
                </button>
                <div class="themePopup">
                    <div class="themeArrowOutline">
                        <div class="themeArrow"></div>
                    </div>
                    <div class="themeTop"></div>
                    <div class="themeBox">
                        <div onclick="setTheme('theme1')" class="themePuck theme1"></div>
                        <div onclick="setTheme('theme2')" class="themePuck theme2"></div>
                        <div onclick="setTheme('theme3')" class="themePuck theme3"></div>
                        <div onclick="setTheme('theme4')" class="themePuck theme4"></div>
                        <div onclick="setTheme('theme5')" class="themePuck theme5"></div>
                        <div onclick="setTheme('theme6')" class="themePuck theme6"></div>
                        <div onclick="setTheme('theme7')" class="themePuck theme7"></div>
                        <div onclick="setTheme('theme8')" class="themePuck theme8"></div>
                        <div onclick="setTheme('theme9')" class="themePuck theme9"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="myflex" onclick="hideThemePopup()">
            <div class="navContainer">
                <button class="navToggleButton" onclick="navToggle()">
                    <img src="/icons/menu-burger.svg" />
                </button>
                <div class="nav">
                    <a href="/"
                        ><img src="/icons/home.svg" />
                        <div>
                            <p>Home</p>
                        </div>
                    </a>
                    <a href="/about/"
                        ><img src="/icons/about.svg" />
                        <div>About</div>
                    </a>
                    <a href="/findMe/"
                        ><img src="/icons/loupe.svg" />
                        <div>Find Me</div>
                    </a>
                    <a href="/work/"
                        ><img src="/icons/id-card.svg" />
                        <div>Work History</div>
                    </a>
                </div>
            </div>
            <div class="main" onclick="clickOffNav()">
                <div class="banner">
                    <div class="bannerMessage1">
                        <b>UPDATE!</b> This is a test message!
                    </div>
                    <div class="bannerMessage2">
                        <b>UPDATE!</b> This is a test message!
                    </div>
                </div>
                <div class="content"></div>
            </div>
        </div>
        <div class="foot"></div>
    </div>
</body>
